name: azsdk-common-generate-sdk-locally-regression
description: Ordinary generation and build-only customization stay separate from compatibility mitigation
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-generate-sdk-locally
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.4
    tool-calls: 0.6
stimuli:
  - name: normal-dotnet-data-plane-generation
    environment: &neighbors
      skills:
        - ..
        - ../../azsdk-common-sdk-breaking-change
    prompt: |
      Generate, build, check, and test the .NET data-plane Azure.Contoso.Widget
      package locally. The caller verified the checkout C:\sdk\azure-sdk-for-net,
      package C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget,
      and config at that package's tsp-location.yaml. Use the normal workflow.
      Skip both commit checkpoints; do not update metadata, changelog, or version.
    constraints: &bounded
      max_turns: 12
      max_tokens: 12000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &normalRouting
          required: [azsdk-common-generate-sdk-locally]
          disallowed: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_verify_setup$"
            - name: "^azure-sdk-mcp-azsdk_package_generate_code$"
            - name: "^azure-sdk-mcp-azsdk_package_build_code$"
            - name: "^azure-sdk-mcp-azsdk_package_run_check$"
            - name: "^azure-sdk-mcp-azsdk_package_run_tests$"
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
            - name: "^azure-sdk-mcp-azsdk_customized_code_update$"
            - name: "^azure-sdk-mcp-azsdk_package_update_(changelog_content|metadata|version)$"

  - name: normal-management-generation-retains-metadata
    environment: *neighbors
    prompt: |
      Generate, build, check and test the .NET management package
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso locally
      using its verified tsp-location.yaml. The checkout is ready.
      Run the normal metadata, changelog, and version updates afterward.
      Skip both commit checkpoints; I want the files left uncommitted.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *normalRouting
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_generate_code$"
            - name: "^azure-sdk-mcp-azsdk_package_build_code$"
            - name: "^azure-sdk-mcp-azsdk_package_run_check$"
            - name: "^azure-sdk-mcp-azsdk_package_run_tests$"
            - name: "^azure-sdk-mcp-azsdk_package_update_changelog_content$"
            - name: "^azure-sdk-mcp-azsdk_package_update_metadata$"
            - name: "^azure-sdk-mcp-azsdk_package_update_version$"
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
            - name: "^azure-sdk-mcp-azsdk_customized_code_update$"

  - name: ordinary-dotnet-analyzer-repair
    environment: *neighbors
    prompt: |
      Fix analyzer error AZC0030 for a newly introduced, unreleased .NET model
      called WidgetParameters in C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget.
      The related TypeSpec project is C:\specs\specification\contoso\Contoso.Widget.
      The caller verified both workspaces and authorizes a naming customization
      for this build-only error. Use the SDK customization tool.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *normalRouting
      - type: tool-calls
        config: &customizationOnly
          required:
            - name: "^azure-sdk-mcp-azsdk_customized_code_update$"
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"

  - name: ordinary-java-customization-repair
    environment: *neighbors
    prompt: |
      Fix a Java SDK build-only customization error in
      C:\sdk\azure-sdk-for-java\sdk\contoso\azure-resourcemanager-contoso.
      Our hand-written customization has a duplicate local variable declaration
      in a newly added method. The caller verified the package. Use the SDK
      customization tool for this SDK-only repair; keep spec inputs unchanged.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *normalRouting
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_customized_code_update$"
              args:
                editScope: "^CustomCode$"
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
