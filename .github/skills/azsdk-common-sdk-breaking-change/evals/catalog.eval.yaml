name: azsdk-common-sdk-breaking-change-catalog
description: Canonical SDK guidance and existing deterministic generator behavior without embedded catalog or invented fixes
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.25
    tool-calls: 0.25
    output-matches: 0.2
    prompt: 0.3
stimuli:
  - name: default-catalog-supports-verified-generic-data-plane-pattern
    rubric:
      - Use the SDK checkout's canonical default catalog when no override is configured.
      - Generic data-plane naming/type/attribute guidance is eligible when verified, without ARM helpers or the management-only skill.
      - Route the selected naming remedy through the current customization tool and authorized SpecInputs only.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Plan only the next SDK breaking-change action; no MCP calls or edits.
      SDK checkout C:\sdk\net contains doc\dev\SDKBreakingChanges.md and the CLI
      has no catalog override. The package at C:\sdk\net\sdk\contoso is .NET
      data-plane. Source review and the canonical catalog verify a generic
      naming-only remedy with unchanged wire semantics. The classified break
      has mitigation="client customization"; I select it and authorize only
      SpecInputs in C:\specs\specification\contoso\Contoso.Widget.
      Which guidance and entry point apply, without borrowing ARM assumptions?
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config: &readOnly
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: output-matches
        config:
          pattern: "(?s)(?=.*SDKBreakingChanges\\.md)(?=.*azsdk_customized_code_update)(?=.*SpecInputs)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Use the canonical doc in the SDK checkout, not an embedded catalog
            or a demand for a separate data-plane file. Follow verified generic
            data-plane guidance with the selected client-customization route
            and SpecInputs. No management-only skill, ARM helper assumptions,
            invented MCP catalog argument, or wider scope.

  - name: configured-catalog-takes-precedence
    rubric:
      - Honor the effective configured SDK catalog instead of silently substituting the default document.
      - Preserve catalog provenance and existing tool schemas without inventing a configuration flag or MCP parameter.
    environment: *onlySkill
    prompt: |
      Explain SDK breaking-change catalog selection only; no MCP calls or edits.
      The common CLI is already configured to use
      C:\sdk\net\doc\dev\ContosoBreakingChanges.md for the .NET management
      package C:\sdk\net\sdk\contoso. That catalog is verified and readable.
      The repo also has its default doc\dev\SDKBreakingChanges.md.
      Which catalog should guide classification and selected mitigations?
      Do not guess how to set the already-configured option.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*ContosoBreakingChanges\\.md)(?=.*(?:configured|effective|override))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Use the verified configured catalog and retain its package/version/
            plane provenance. The default applies only without an override.
            Do not invent MCP parameters, ignore the configured path, or copy
            catalog entries into an embedded replacement.

  - name: catalog-load-failure-keeps-raw-evidence
    rubric:
      - Preserve original raw API diagnostics and the catalog-load error while marking classification incomplete.
      - Stop mitigation instead of silently falling back to the default or an embedded/reconstructed catalog.
    environment: *onlySkill
    prompt: |
      Review a captured SDK detector outcome only; no MCP calls or edits.
      .NET management Azure.ResourceManager.Contoso at C:\sdk\net\sdk\contoso
      produced raw CP0002 evidence for removed Widget.Get().
      Classification then failed because the explicitly configured catalog
      could not be read. The common CLI preserved the raw details and error;
      it did not return a complete classified result.
      A default catalog happens to exist. What should the workflow report?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*CP0002)(?=.*Widget\\.Get)(?=.*catalog)(?=.*(?:error|failed|incomplete|blocked))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Retain CP0002, Widget.Get, and the configured-catalog error.
            Classification is incomplete; stop and resolve that prerequisite
            before retrying. Do not drop raw evidence, infer a clean result,
            invent mitigation values, or silently use the default/embedded notes
            to bypass the configured catalog failure.

  - name: conditional-header-preservation-uses-existing-generator
    rubric:
      - Route the selected verified management conditional-header pattern through existing generator behavior.
      - Preserve the BackCompatHelper eligibility and skip guards; do not manually transform generated public methods.
    environment: *onlySkill
    prompt: |
      Plan a verified .NET management SDK mitigation only; no MCP calls or edits.
      Azure.ResourceManager.Contoso at C:\sdk\contoso has mitigation="generator"
      for the canonical catalog's supported conditional-header pattern.
      Source review verified BackCompatHelper's same-name, return-type and
      parameter requirements; no existing overload or accepted-removal entry
      causes it to skip. I selected the remedy and authorized its documented
      inputs. Should the workflow use that generator behavior or hand-edit
      the old public method into generated source?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*BackCompatHelper)(?=.*(?:generat|regenerat))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Use existing management generator preservation as documented in the
            effective SDK catalog. Keep all matching, existing-overload and
            accepted-removal guards intact; do not hand-edit generated methods,
            reimplement the helper, or widen scope. Refresh artifacts and rerun
            compatibility followed by ordinary gates before claiming success.

  - name: conditional-header-skip-guards-are-not-overridden
    rubric:
      - Report each rejected or skipped candidate according to the existing helper's guards.
      - Do not force transformations, add duplicate overloads, or alter accepted-removal policy automatically.
    environment: *onlySkill
    prompt: |
      Review three proposed management SDK conditional-header interventions
      for Azure.ResourceManager.Contoso at C:\sdk\contoso. Do not call MCP tools.
      The catalog cites BackCompatHelper. Candidate A has a different return
      type from the prior contract. Candidate B matches name/return/parameters
      but already has the old overload. Candidate C matches but is covered by
      an existing accepted-removal entry. A generator suggestion listed all
      three. Should the workflow force old-public-method transformations anyway?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*return)(?=.*overload)(?=.*accepted.removal)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            A fails eligibility; B and C are deliberate skip cases. Do not
            weaken matching guards, introduce duplicate generated overloads, or
            add/remove accepted-removal entries to force a fix. Preserve each
            finding and request owner judgment where unresolved; neither an
            existing policy entry nor a generator hint is a new clean verdict.

  - name: model-factory-contracts-use-existing-preservation
    rubric:
      - Use the verified management model-factory preservation path for previous contract overloads and forwarding.
      - Do not replace it with invented forwarding implementations, generated-source edits or a build-only compatibility verdict.
    environment: *onlySkill
    prompt: |
      Plan a selected .NET management SDK breaking-change remedy only; no MCP
      calls or edits. Azure.ResourceManager.Contoso at C:\sdk\contoso has a
      supported model reshape with mitigation="generator".
      The effective catalog and source review identify ModelFactoryVisitor and
      ModelFactoryBackwardCompatHelper as preserving prior contract overloads
      and forwarding. I authorize the documented selected input changes.
      Should the common workflow invent a new factory shim or reuse this path?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*ModelFactoryVisitor)(?=.*ModelFactoryBackwardCompatHelper)(?=.*(?:overload|forward))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Reuse existing generator preservation for the verified supported
            management reshape, retaining previous contract overloads/forwarding.
            Do not invent a shim, patch generated factory source, assume ARM
            helpers apply to data plane, or claim success from build alone.
            Regenerate/current artifacts, detect, then run ordinary gates.
