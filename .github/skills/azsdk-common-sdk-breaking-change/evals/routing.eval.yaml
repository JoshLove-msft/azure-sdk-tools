name: azsdk-common-sdk-breaking-change-routing
description: Shared compatibility routing, neighboring boundaries, and detector invocation contracts
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.4
    tool-calls: 0.4
    prompt: 0.2
stimuli:
  - name: trigger-dotnet-management-apicompat
    environment: &neighbors
      skills:
        - ..
        - ../../azsdk-common-generate-sdk-locally
        - ../../azsdk-common-generate-sdk-pipeline
        - ../../azsdk-common-sdk-release
    prompt: |
      Review the ApiCompat breaking changes for the .NET management package
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso.
      Explain the compatibility workflow before making any changes.
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-sdk-breaking-change]

  - name: trigger-dotnet-data-plane-sdk-pr
    environment: *neighbors
    prompt: |
      My SDK PR changes Azure.Contoso.Widget in
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget.
      Help me review SDK compatibility against the latest GA release and choose
      mitigations for any breaks. Start with the workflow; do not edit yet.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-sdk-breaking-change]

  - name: trigger-spec-pr-breaking-changes
    environment: *neighbors
    prompt: |
      The Contoso spec PR generated a .NET SDK with breaking changes in
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso.
      The spec project is C:\specs\specification\contoso\Contoso.Management.
      Explain how to investigate and select mitigations; do not change files.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-sdk-breaking-change]

  - name: anti-trigger-normal-local-python-generation
    environment: *neighbors
    prompt: |
      Generate the Python SDK locally from
      C:\specs\specification\contoso\Contoso.Management\tspconfig.yaml.
      My SDK checkout is C:\sdk\azure-sdk-for-python. Use the normal local workflow.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-generate-sdk-locally]
          disallowed: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config:
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"

  - name: anti-trigger-release-plan-generation
    environment: *neighbors
    prompt: |
      Generate SDKs for all target languages in release plan 12345 using the
      pipeline and return the generated SDK PR links. I have no local checkout.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-generate-sdk-pipeline]
          disallowed: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config:
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
            - name: "^azure-sdk-mcp-azsdk_package_generate_code$"

  - name: anti-trigger-normal-release-readiness
    environment: *neighbors
    prompt: "Check whether the Java package azure-messaging-eventhubs is ready for release."
    constraints: *bounded
    graders:
      - type: skill-invocation
        config:
          required: [azsdk-common-sdk-release]
          disallowed: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config:
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"

  - name: detect-dotnet-management-existing-artifacts
    tags:
      coverage: mock-detector
    rubric:
      - Call the common detector with the given packagePath and changesOnly=false without rebuilding current artifacts.
      - Report the fixture's removed Name and added DisplayName, actual breaking verdict and manual route without edits.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Use the shared SDK breaking-change workflow for the .NET management package
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso.
      The caller has verified this package, its latest GA baseline, and current
      comparison artifacts. No generation or build is needed. Call the detector
      once for classified changes and report its actual result. Do not mitigate.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
              pattern: &classifiedRequest '"changesOnly"\s*:\s*false(?=\s*[,}])'
              result: "(?is)(?=.*hasBreakingChange[^a-z0-9]{1,12}true)(?=.*breakingChanges)(?=.*details)(?=.*\\bName\\b)(?=.*\\bDisplayName\\b)"
              args:
                packagePath: '^C:[\\/]sdk[\\/]azure-sdk-for-net[\\/]sdk[\\/]contoso[\\/]Azure\.ResourceManager\.Contoso$'
          disallowed: &detectionOnly
            - name: "^azure-sdk-mcp-azsdk_customized_code_update$"
            - name: "^azure-sdk-mcp-azsdk_package_(generate_code|build_code|run_check|run_tests)$"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Verify the trajectory calls azsdk_package_detect_breaking_change with
            the supplied packagePath and changesOnly=false, without inventing
            baseline/tool parameters or rebuilding already-current artifacts.
            Accurately report the complete fixture's breaking removal, addition,
            original diagnostic and manual route. A generic success message or
            missing classified result does not satisfy this positive case.

  - name: detect-dotnet-data-plane-despite-analyzer-failure
    tags:
      coverage: mock-detector
    rubric:
      - Run classified detection on current .NET data-plane artifacts despite the separate analyzer failure.
      - Retain AZC0030 independently and never claim compatibility from incomplete detector output.
    environment: *onlySkill
    prompt: |
      Check SDK breaking changes for .NET data-plane package
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget.
      The caller verified the latest GA baseline and current comparison artifacts.
      A separate analyzer gate failed with AZC0030. Call the compatibility
      detector on those artifacts now; do not repair the analyzer or rebuild.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
              pattern: *classifiedRequest
              result: "(?is)(?=.*hasBreakingChange[^a-z0-9]{1,12}true)(?=.*breakingChanges)(?=.*details)(?=.*\\bName\\b)(?=.*\\bDisplayName\\b)"
              args:
                packagePath: '^C:[\\/]sdk[\\/]azure-sdk-for-net[\\/]sdk[\\/]contoso[\\/]Azure\.Contoso\.Widget$'
          disallowed: *detectionOnly
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The trajectory must call the common detector with changesOnly=false
            for Azure.Contoso.Widget despite the separate AZC0030 failure, without
            invoking customization/build/check tools. The final response retains
            AZC0030 independently and reports the fixture's removed Name, added
            DisplayName, CP0002 and breaking verdict; do not infer build success.

  - name: detect-java-regression
    tags:
      coverage: mock-detector
    rubric:
      - Use the common classified detector for the given Java package without .NET-specific mitigation or fabricated tool arguments.
      - Report the actual legacy fixture's breaking removal and addition without requiring a .NET mitigation enum.
    environment: *onlySkill
    prompt: |
      Check SDK compatibility for the Java package
      C:\sdk\azure-sdk-for-java\sdk\contoso\azure-resourcemanager-contoso.
      The caller verified the package, baseline, and current generated output.
      Call the common detector for classified changes. Report its actual output
      without modifying files; do not apply .NET-specific mitigation guidance.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
              pattern: *classifiedRequest
              result: "(?is)(?=.*hasBreakingChange[^a-z0-9]{1,12}true)(?=.*breakingChanges)(?=.*details)(?=.*\\bname\\b)(?=.*\\bdisplayName\\b)"
              args:
                packagePath: '^C:[\\/]sdk[\\/]azure-sdk-for-java[\\/]sdk[\\/]contoso[\\/]azure-resourcemanager-contoso$'
          disallowed: *detectionOnly
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The common detector must receive the supplied Java packagePath and
            changesOnly=false. The agent must not call a nonexistent language-
            specific detector or apply a .NET skill to Java. Report the actual
            name() removal and displayName() addition with a breaking verdict;
            the absent .NET-only mitigation field is valid for this Java result.

  - name: detect-catalog-error-retains-raw-result
    tags:
      coverage: mock-detector
    rubric:
      - Invoke classified detection once and retain the raw removal/addition and catalog error.
      - Stop rather than retrying, customizing or inferring a clean classified result.
    environment: *onlySkill
    prompt: |
      Use the SDK breaking-change workflow for .NET management package
      C:\sdk\mock-catalog-error\Azure.ResourceManager.Contoso.
      The caller verified this package and current comparison inputs. Call the
      detector once for classification and report its actual result, including
      any retained raw evidence on failure. Do not retry or mitigate.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
              pattern: *classifiedRequest
              result: "(?is)(?=.*CP0002)(?=.*details)(?=.*catalog)"
              args:
                packagePath: '^C:[\\/]sdk[\\/]mock-catalog-error[\\/]Azure\.ResourceManager\.Contoso$'
          disallowed: *detectionOnly
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The actual mock result has a catalog-load error with CP0002 removal
            and addition evidence preserved. Report both evidence and error,
            mark classification incomplete, and stop without a retry,
            customization, embedded-catalog fallback or clean verdict.

  - name: detect-no-ga-reports-not-evaluated
    tags:
      coverage: mock-detector
    rubric:
      - Use the detector's actual no-GA limitation and preserve compatibility not evaluated.
      - Do not equate the default false flag/empty break list with a completed clean comparison.
    environment: *onlySkill
    prompt: |
      Check SDK breaking changes for .NET data-plane package
      C:\sdk\mock-no-baseline\Azure.Contoso.Widget.
      The caller verified the package and current artifacts. Use the detector
      once to determine the comparison outcome and baseline availability.
      Report its actual result without retries or edits.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          required:
            - name: "^azure-sdk-mcp-azsdk_package_detect_breaking_change$"
              pattern: *classifiedRequest
              result: "(?is)(?=.*Compatibility not evaluated)(?=.*limitations)"
              args:
                packagePath: '^C:[\\/]sdk[\\/]mock-no-baseline[\\/]Azure\.Contoso\.Widget$'
          disallowed: *detectionOnly
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve the actual compatibility-not-evaluated message and
            missing-GA limitation. A false flag and empty break list in this
            scenario are not a completed clean comparison. Require an explicit
            initial-release/manual decision, not a preview baseline or a fix.

  - name: pipeline-result-without-local-evidence
    rubric:
      - A generation pipeline or PR link alone cannot establish compatibility; require matching package/revision evidence and current artifacts.
      - Report a handoff with no automatic edits, posting, approval, release, or clean verdict.
    environment: *onlySkill
    prompt: |
      Review the SDK breaking-change status after release-plan pipeline 12345
      generated Azure.ResourceManager.Contoso. We have an SDK PR link but no
      detector output, matching local checkout, or current artifacts. Explain
      the handoff only; do not call MCP tools or start another pipeline.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The response must say that a successful pipeline or SDK PR link does
            not establish compatibility. Require matching package/revision
            evidence and current artifacts/local checkout for the shared workflow.
            No automatic mitigation, posting, approval, release, or clean verdict.

  - name: release-readiness-compatibility-blocker
    rubric:
      - Require compatibility evidence and user-selected mitigation before retrying readiness or releasing.
      - Do not recommend suppression, automatic approval, or replacing detection with readiness.
    environment: *onlySkill
    prompt: |
      The release readiness check for Azure.Contoso.Widget failed with an
      ApiCompat removal diagnostic. Use the SDK breaking-change workflow to
      explain the next steps before release. I have not selected a mitigation.
      Discuss only; do not invoke MCP tools, publish, or post anything.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config:
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Require full evidence and user-selected mitigation through the common
            workflow before repeating readiness or releasing. Do not suggest
            suppression, automatic approval, or that release readiness replaces
            compatibility detection.
