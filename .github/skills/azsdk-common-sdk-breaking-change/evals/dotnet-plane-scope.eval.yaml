name: azsdk-common-sdk-breaking-change-dotnet-plane-scope
description: Verified .NET SDK-plane applicability and management-pattern prerequisites without executing SDK remedies
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.25
    tool-calls: 0.25
    output-matches: 0.2
    prompt: 0.3
stimuli:
  - name: management-sdk-custom-pattern-is-plane-appropriate
    rubric:
      - The verified management-only SDK skill is an appropriate entry point for a selected supported management SDK Custom/CodeGenType pattern.
      - Respect the SDK-only authorization and actual skill instructions without inventing invocation arguments or editing generated/spec files.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Plan SDK breaking-change routing only; no MCP calls, external skill
      invocation, or edits. Package Azure.ResourceManager.Contoso at
      C:\sdk\net\sdk\contoso is verified management-plane.
      Its break has mitigation="generator". Source review and current management
      mitigation guidance verify the selected SDK Custom partial/CodeGenType
      pattern, with no TypeSpec, hierarchy or wire change required.
      I authorize only that SDK custom-source remedy, not generated files or
      spec inputs. Which guidance should own it and what boundaries remain?
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config: &readOnly
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: output-matches
        config:
          pattern: "(?s)(?=.*mitigate-breaking-changes)(?=.*CodeGenType)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Recognize the existing management skill as applicable after reading
            its actual instructions and confirming the supported selected
            pattern. Preserve the SDK Custom-source boundary and pinned spec,
            do not invent external skill arguments or attribute syntax, and
            require common re-evaluation before claiming compatibility.

  - name: data-plane-cannot-borrow-arm-wire-patterns
    rubric:
      - Reject management-only ARM pattern applicability to the verified data-plane package despite the generator route.
      - Keep shared detection and raw evidence, and require verified data-plane guidance or a manual handoff.
    environment: *onlySkill
    prompt: |
      Discuss a captured SDK mitigation suggestion only; no MCP calls or edits.
      Azure.Contoso.Widget at C:\sdk\net\sdk\contoso is verified data-plane.
      A break is labeled mitigation="generator", but its suggested resolution
      borrows WirePathAttribute and hierarchyBuilding from the installed
      management-only mitigate-breaking-changes skill. No data-plane support
      evidence exists. Is the installed skill enough to apply these remedies?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:data.plane|dataplane))(?=.*(?:ARM|management))(?=.*(?:handoff|manual|unsupported|inapplicable))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The installed management skill and generator enum do not prove
            data-plane support. Flag the mismatched guidance, preserve evidence,
            and hand off rather than applying ARM patterns or enabling their
            emitter options. Do not disable the common data-plane detector.

  - name: separately-verified-data-plane-guidance-remains-eligible
    rubric:
      - Use the common workflow with separately verified data-plane guidance for this selected supported pattern.
      - Do not route through the management-only skill or declare all data-plane generator mitigations unsupported.
    environment: *onlySkill
    prompt: |
      Plan the route only for Azure.Contoso.Widget at C:\sdk\net\sdk\contoso,
      a verified .NET data-plane package. The selected break has
      mitigation="generator"; the caller has verified an applicable pattern
      in the canonical SDK doc/dev/SDKBreakingChanges.md generic guidance,
      explicitly applicable to data plane, and approved its SDK-only surface.
      It does not use ARM-specific patterns or the management-only skill.
      Which common flow applies? No MCP calls, external skill invocation or edits.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:data.plane|dataplane))(?=.*(?:guidance|pattern))(?=.*(?:detect|re.evaluat))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Retain the same detect/select/mitigate/re-evaluate workflow using
            the applicable data-plane guidance, subject to actual instructions
            and approved scope. Do not reject solely because the management
            skill is inapplicable, invoke that skill, or invent a remedy.

  - name: base-type-fix-requires-hierarchy-parity
    rubric:
      - Require verification of baseline/current hierarchy parity before a base-type mitigation.
      - A generator route or selected item cannot replace hierarchy evidence or justify speculative inheritance changes.
    environment: *onlySkill
    prompt: |
      Review a proposed .NET management SDK breaking-change mitigation only.
      Azure.ResourceManager.Contoso at C:\sdk\contoso has mitigation="generator"
      for a base-type difference. I selected the item, but nobody has compared
      baseline and current hierarchies. Can the agent change the base type now
      based only on the classifier's suggestion? Do not run MCP tools or edit.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*hierarch)(?=.*(?:parity|baseline))(?=.*(?:before|require|block|verify))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Block the base-type fix pending baseline/current hierarchy parity
            verification. Missing or mismatched evidence requires investigation
            or manual judgment, not guessed inheritance, generation switches,
            source edits, or suppression.

  - name: legacy-hierarchy-needs-explicit-owner-approval
    rubric:
      - Explicit responsible-owner approval is required before using legacy hierarchyBuilding even after hierarchy parity and user selection.
      - Selection or configuration-edit permission does not substitute for owner approval or waive remaining scope restrictions.
    environment: *onlySkill
    prompt: |
      Plan the SDK breaking-change next step only; no MCP calls or edits.
      Azure.ResourceManager.Contoso at C:\sdk\contoso is management-plane.
      The selected generator pattern has verified hierarchy parity but requires
      legacy hierarchyBuilding. I selected it and can edit project configuration,
      but the responsible owner has not explicitly approved using that legacy
      behavior. Is selecting the item enough to proceed?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*hierarchyBuilding)(?=.*owner)(?=.*approv)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Stop for explicit owner approval of legacy hierarchyBuilding.
            General selection/configuration permissions are insufficient.
            Approval, when obtained, still must not widen edit scope, change
            the pinned spec, or waive parity and other evidence requirements.

  - name: wire-path-disabled-is-a-scope-safe-blocker
    rubric:
      - Require the management emitter's enable-wire-path-attribute option to be true before applying WirePathAttribute.
      - Missing/false configuration blocks the remedy; SDK-only authorization cannot silently enable the option or widen scope.
    environment: *onlySkill
    prompt: |
      Review a selected .NET management SDK mitigation only; no MCP calls.
      Azure.ResourceManager.Contoso at C:\sdk\contoso has mitigation="generator"
      with a proposed WirePathAttribute remedy. The management emitter has
      enable-wire-path-attribute: false. I authorize SDK custom source only,
      not spec inputs, emitter configuration, or pinned-commit changes.
      May the attribute be added anyway or the option silently enabled?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*WirePathAttribute)(?=.*enable-wire-path-attribute)(?=.*(?:block|require|false|handoff|owner))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Do not apply the attribute while the required management emitter
            option is false/missing. Hand off the necessary authorized
            configuration work rather than silently enabling it, using All or
            SpecInputs, advancing a pin, or claiming the fix works without it.

  - name: wire-path-enabled-does-not-select-a-mitigation
    rubric:
      - Recognize the true management emitter option as satisfying that prerequisite for an otherwise verified pattern.
      - The enabled feature does not select the item or authorize changes; wait for user selection.
    environment: *onlySkill
    prompt: |
      Explain this .NET management compatibility candidate only; no MCP calls
      or edits. Azure.ResourceManager.Contoso at C:\sdk\contoso has a verified
      management WirePathAttribute pattern and mitigation="generator".
      The management emitter already has enable-wire-path-attribute: true.
      I requested a report but have not selected the candidate for mitigation.
      Does the enabled option mean the agent should apply it now?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:select|authoriz|approval))(?=.*(?:WirePathAttribute|enable-wire-path-attribute))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The existing true option satisfies the feature prerequisite but
            does not authorize applying the remedy. Present the candidate and
            evidence, obtain selection/scope, and do not claim it was applied or
            compatibility restored from configuration alone.

  - name: management-typespec-recipes-use-approved-customization-route
    rubric:
      - A selected verified clientName remedy uses the current customization tool with SpecInputs, not direct edits via a broader SDK skill.
      - Other recipes such as markAsPageable and alternateType remain unselected; available guidance does not authorize applying all patterns.
    environment: *onlySkill
    prompt: |
      Plan the next SDK breaking-change call only, with no MCP calls or edits.
      Azure.ResourceManager.Contoso at C:\sdk\net\sdk\contoso is management-plane.
      The installed management skill describes clientName, markAsPageable and
      alternateType. My classified break has mitigation="client customization".
      Source review verifies only a clientName naming remedy with unchanged wire
      semantics. I select that remedy and authorize SpecInputs at
      C:\specs\specification\contoso\Contoso.Management, not SDK custom source.
      How should the common workflow route it?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*azsdk_customized_code_update)(?=.*SpecInputs)(?=.*clientName)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Plan the existing azsdk_customized_code_update for only the selected
            evidence-backed remedy with the correct package/spec workspace and
            SpecInputs. Do not invoke the historical tool name, edit TypeSpec
            directly through broad skill instructions, widen to All, or apply
            unrelated pageable/alternate-type recipes without selection.

  - name: missing-sdk-companion-extractor-is-not-clean
    rubric:
      - Preserve the common detector's missing-companion-script error and report the current comparison as blocked.
      - Do not guess native script names/flags, substitute invented evidence, or interpret a default empty result as no breaks.
    environment: *onlySkill
    prompt: |
      Interpret a captured common SDK breaking-change detector error only.
      .NET Azure.Contoso.Widget at C:\sdk\contoso reports
      "SDK companion extraction script is missing". An error response also
      contains an empty changes list. No current classified comparison completed.
      Do not call MCP tools, search a companion repo, or invent native commands.
      What should the workflow report?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:companion|script))(?=.*(?:missing|unavailable))(?=.*(?:block|inconclusive|error))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Report blocked/inconclusive with the original missing-script
            diagnostic. Resolve the SDK-side prerequisite through verified
            guidance before a new common-detector attempt. Do not guess script
            invocations, suppress the error, or infer compatibility from empty
            changes in the failed response.
