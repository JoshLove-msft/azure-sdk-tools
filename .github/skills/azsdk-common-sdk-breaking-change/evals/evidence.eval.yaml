name: azsdk-common-sdk-breaking-change-evidence
description: Read-only interpretation of captured compatibility evidence and independent gate failures
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.25
    tool-calls: 0.25
    output-matches: 0.2
    prompt: 0.3
stimuli:
  - name: show-entire-management-change-inventory
    rubric:
      - Preserve C1, C2, C3, CP0002 and package/baseline identity, including the non-breaking addition.
      - Explain root-cause uncertainty, do not treat the rename as proven, and require user selection before mitigation.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Use the SDK breaking-change workflow to review this captured report only.
      Do not call MCP tools or modify files.
      Package: .NET management Azure.ResourceManager.Contoso at
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso.
      Latest GA baseline 1.0.0 and current PR artifacts were verified by the caller.
      Successful result.changes has three entries:
      C1: removed WidgetResource.Get(), ApiCompat CP0002, breaking.
      C2: added WidgetResource.GetDetails(), non-breaking as an addition.
      C3: changed WidgetData.Count from int to long, signature change, breaking.
      result.hasBreakingChange=true; result.breakingChanges contains C1 and C3.
      Both breaks have mitigation="manual"; their category/resolution describe
      unverified causes requiring owner review, and originBreaks retain the
      corresponding original removal/signature diagnostics.
      The classifier suggests C1/C2 could be a rename, but has no source/wire
      mapping proof. I have not selected any changes to mitigate.
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config: &readOnly
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: output-matches
        config:
          pattern: "(?s)(?=.*C1)(?=.*C2)(?=.*C3)(?=.*CP0002)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Include all three changes, including the non-breaking addition, the
            package/baseline and original diagnostic. Distinguish classification
            from root-cause confidence. The rename remains a hypothesis; no
            automatic rename/type shim is proposed as proven safe. Obtain user
            selection before any edits and retain unresolved C1/C3.

  - name: compatibility-visible-alongside-compilation-and-analyzers
    rubric:
      - Report both API changes and the CP0002 compatibility failure independently of CS0246 and AZC0030.
      - Do not discard valid current compatibility evidence or confuse analyzer repair with compatibility mitigation.
    environment: *onlySkill
    prompt: |
      Review this captured SDK breaking-change evidence only, with no MCP calls
      or edits. Package .NET data plane Azure.Contoso.Widget, at
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget.
      Latest GA baseline and current comparison artifacts are verified.
      Successful classified result: changes=[removed WidgetClient.GetWidget,
      added WidgetClient.GetWidgetDetails], hasBreakingChange=true,
      breakingChanges=[removed WidgetClient.GetWidget, mitigation="manual",
      category="unknown", resolution="Review the mapping",
      originBreaks=["CP0002: removed WidgetClient.GetWidget"]].
      Separately, compilation reports CS0246 and analyzer validation reports
      AZC0030. Summarize the package state without repairing anything yet.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*CP0002)(?=.*CS0246)(?=.*AZC0030)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Report the removal and addition, confirmed compatibility break, and
            both separate compilation/analyzer failures. Do not discard current
            ApiCompat evidence because the other gates failed or treat an
            analyzer repair as a compatibility mitigation.

  - name: no-ga-baseline-is-not-clean
    rubric:
      - Preserve the CLI's compatibility-not-evaluated status and missing GA baseline despite the empty changes list.
      - Require an explicit initial-release/manual decision instead of silently substituting preview or empty baselines.
    environment: *onlySkill
    prompt: |
      Interpret this captured detector outcome for .NET management
      Azure.ResourceManager.Contoso at C:\sdk\contoso. Do not call MCP tools.
      The CLI reports "Compatibility not evaluated: no released GA baseline
      was found". A preview package exists, and the response contains an empty
      changes list.
      Can this PR be called compatible, and what decision is needed?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*not.{0,20}evaluated)(?=.*(?:GA|baseline))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve compatibility not evaluated and the missing-GA diagnostic;
            do not silently compare to preview, another package,
            or an empty baseline. Request an explicit initial-release/manual
            review decision rather than claiming zero breaking changes.

  - name: stale-artifacts-after-failed-refresh
    rubric:
      - Revision B is inconclusive because revision A artifacts are stale; preserve the historical result and CS0246 separately.
      - Require current artifacts and re-detection without bypassing checks or reusing stale success.
    environment: *onlySkill
    prompt: |
      Review this captured .NET SDK compatibility report without MCP calls.
      Package Azure.Contoso.Widget at C:\sdk\contoso has a clean comparison from
      revision A. Current spec inputs are revision B. Regeneration ran, but the
      assembly refresh failed with CS0246 and left only revision A artifacts.
      The old report has changes=[], hasBreakingChange=false, breakingChanges=[].
      What can I conclude about revision B?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(stale|outdated|old|revision A).{0,160}(artifact|assembl|snapshot|evidence)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Revision B is inconclusive/blocked, not compatible. Distinguish
            revision A's historical result and CS0246 from current evidence.
            Require valid current artifacts and re-detection without suppressing
            checks or reusing the old success.

  - name: missing-artifacts-with-false-flag
    rubric:
      - Missing current artifacts override the default false flag and empty arrays; the outcome is blocked, not compatible.
      - Require valid refreshed artifacts before another detection, without disabling checks or fabricating inputs.
    environment: *onlySkill
    prompt: |
      Interpret this captured breaking-change detector response only; no MCP
      calls. .NET package Azure.ResourceManager.Contoso at C:\sdk\contoso.
      The tool failed because the required current assembly is missing, but
      a default result still says changes=[], hasBreakingChange=false,
      breakingChanges=[]. Explain the outcome and safe next step.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(missing.{0,80}(artifact|assembly)|(?:artifact|assembly).{0,80}missing)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The error takes precedence over the default false flag/empty arrays.
            Require a current artifact refresh followed by detection, with no
            clean verdict, check disabling, invented inputs, or blind retry loop.

  - name: classifier-failure-preserves-raw-changes
    rubric:
      - Preserve CP0002, the removed API and classifier parse diagnostic while marking classification incomplete.
      - Stop mitigation instead of inventing a classified verdict, clean result, or fix.
    environment: *onlySkill
    prompt: |
      Review this captured SDK compatibility report only; do not call MCP tools.
      Package .NET Azure.Contoso.Widget at C:\sdk\contoso, latest GA 1.0.0.
      Raw detector evidence: CP0002 removed WidgetClient.GetWidget().
      Classification failed with "classifier output could not be parsed".
      The response has raw changes but no complete classified result.
      Explain what is known and what remains blocked.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*CP0002)(?=.*[Cc]lassif)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve CP0002 and the removed API plus classifier parse error.
            State that classification is incomplete and stop mitigation; do
            not invent a successful classification, empty clean result, or a fix.

  - name: detector-error-preserves-diagnostics
    rubric:
      - Preserve exit code 2, baseline load error and partial raw evidence while reporting an incomplete comparison.
      - Stop until the baseline-loading blocker is resolved; no blind retry, mitigation from partial data, or clean verdict.
    environment: *onlySkill
    prompt: |
      Review this captured .NET SDK breaking-change outcome without MCP calls.
      Azure.ResourceManager.Contoso at C:\sdk\contoso: detector process failed
      with exit code 2 and diagnostic "ApiCompat comparison could not load the
      baseline assembly". Some partial raw removals were emitted first.
      What should happen before any mitigation?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(baseline.{0,100}assembly|assembly.{0,100}baseline)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve exit code/error and partial evidence, mark the comparison
            incomplete, and stop. Require resolving baseline loading before a
            new attempt. Do not apply mitigations from partial data, silently
            retry, or declare no breaks.

  - name: malformed-success-envelope
    rubric:
      - Identify the missing classified result fields and explain that the success message cannot establish compatibility.
      - Do not fabricate empty arrays, a false flag, or package metadata to complete the response.
    environment: *onlySkill
    prompt: |
      Review this captured response from SDK breaking-change detection only:
      {"message":"Success"}.
      The requested .NET data-plane package was Azure.Contoso.Widget at
      C:\sdk\contoso. No result.changes, result.hasBreakingChange, or
      result.breakingChanges fields were returned. Do not invoke MCP tools.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(incomplete|inconclusive|malformed|missing|blocked)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            A success message alone is not a compatibility result. Explain the
            missing envelope/result evidence and stop without substituting empty
            arrays, false flags, or inferred package metadata.

  - name: inconsistent-classified-result
    rubric:
      - Flag the contradictory Boolean and breaking-change entries; retain the removal and CP0002.
      - Stop for a corrected result instead of discarding evidence or trusting the false flag as clean.
    environment: *onlySkill
    prompt: |
      Explain this captured .NET SDK compatibility result without MCP calls.
      Package Azure.Contoso.Widget at C:\sdk\contoso, matching latest GA and
      current artifacts. result.changes reports removed WidgetClient.GetWidget
      and result.breakingChanges includes that removal with CP0002 and
      mitigation="manual", but
      result.hasBreakingChange=false. Which outcome can we report?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(inconsisten|contradict|inconclusive|blocked)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Flag contradictory data, preserve the removal diagnostic, and stop
            for a corrected result. Do not trust the false Boolean over breaking
            entries, erase the evidence, or claim compatibility.

  - name: raw-only-output-does-not-classify
    tags:
      coverage: native-verdict
    rubric:
      - Preserve both raw changes and state that changesOnly=true does not provide a classified verdict.
      - Retain the detector's positive breaking flag; require classification before mitigation, not before acknowledging a detected break.
    environment: *onlySkill
    prompt: |
      Review the captured changesOnly=true SDK detector output for
      Azure.ResourceManager.Contoso at C:\sdk\contoso. It lists one added method
      and one removed overload, with hasBreakingChange=true against a verified
      latest GA baseline on current artifacts, but contains no classification.
      Do not call MCP tools. Does successful raw detection establish compatibility?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(classif|raw).{0,160}(required|needed|missing|incomplete|not|false)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve both raw changes and acknowledge the authoritative
            positive breaking flag. Classification is still needed for
            root-cause and mitigation routing, not for recognizing the break.
            Do not claim compatibility or invent a mitigation.

  - name: raw-negative-verdict-does-not-require-llm
    tags:
      coverage: native-verdict
    rubric:
      - Preserve a successful ApiCompat verdict without requiring an LLM to ratify it.
      - Display the addition and distinguish compatibility from the failed analyzer gate.
    environment: *onlySkill
    prompt: |
      Interpret a successful changesOnly=true report for Azure.Contoso.Widget.
      The latest GA baseline 1.0.0 and current artifacts were verified.
      result.hasBreakingChange=false, result.breakingChanges=[], and
      result.changes lists one added method. The normal analyzer gate failed.
      Do not call MCP or edit files. Is LLM classification needed to recognize
      the detector's verdict, and is the SDK ready to release?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Report no detected breaks and the method addition for the verified
            comparison without requiring LLM classification to establish that
            verdict. Keep the analyzer failure and do not claim release
            readiness or wire/behavior compatibility.

  - name: valid-additive-result-with-independent-failing-gate
    rubric:
      - Report no detected breaks for this complete Java comparison while displaying the non-breaking addition.
      - Preserve the separate test timeout, do not claim overall readiness, and do not apply .NET-only logic.
    environment: *onlySkill
    prompt: |
      Review this captured SDK compatibility report only; no MCP calls.
      Java package azure-resourcemanager-contoso at C:\sdk\java\contoso.
      A successful classified comparison against latest GA 1.0.0 on verified
      current artifacts has one non-breaking method addition in result.changes,
      result.hasBreakingChange=false, result.breakingChanges=[].
      The ordinary test gate separately failed with a timeout. Summarize status.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(add|non.breaking).{0,160}(method|change|API|compatib)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Accurately report no detected breaks for the compared Java snapshot
            while still displaying the addition and failed test gate. Do not
            refuse a valid complete clean comparison, claim overall readiness,
            or apply .NET-only mitigation logic.

  - name: unsupported-language-is-explicit
    rubric:
      - Report unsupported detection explicitly and hand off to verified language guidance or manual review.
      - Do not equate missing output to zero breaks or invent a language detector fallback.
    environment: *onlySkill
    prompt: |
      Interpret a captured SDK breaking-change tool failure for a Rust package
      at C:\sdk\azure-sdk-for-rust\sdk\contoso. The detector reports unsupported
      language and returns no changes. Do not call MCP tools or edit anything.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(unsupported|not supported|unavailable)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Report the unsupported detector explicitly and hand off to verified
            language guidance/manual review. Never reinterpret missing output
            as zero breaks or invent a Rust or .NET detector fallback.
