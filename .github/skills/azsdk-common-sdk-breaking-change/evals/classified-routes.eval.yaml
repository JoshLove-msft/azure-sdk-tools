name: azsdk-common-sdk-breaking-change-classified-routes
description: Classified mitigation fields guide selected actions without authorizing edits or changing legacy language contracts
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.25
    tool-calls: 0.25
    output-matches: 0.2
    prompt: 0.3
stimuli:
  - name: per-break-routes-preserve-selection-and-origin
    rubric:
      - Retain all three changes and their category, resolution, originBreaks and exact mitigation values.
      - Only the selected generator item may proceed to verified SDK guidance; neither unselected item is scheduled for changes.
      - Category is not the route, and a route or resolution cannot authorize edits or prove pattern support.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Review a captured SDK breaking-change report for .NET management
      Azure.ResourceManager.Contoso at C:\sdk\net\sdk\contoso.
      Latest GA and current artifacts are verified. A complete classified
      result has three breaks, all with category="emitter change":
      G: breakingChange="GeneratorMember removed", mitigation="generator",
         resolution="Use the verified SDK generator pattern",
         originBreaks=["CP0002: Widget.GeneratorMember removed"].
      C: breakingChange="CustomMember changed", mitigation="client customization",
         resolution="Investigate a selected SDK customization",
         originBreaks=["CP0002: Widget.CustomMember removed"].
      M: breakingChange="ManualMember changed", mitigation="manual",
         resolution="Owner decision required",
         originBreaks=["CP0002: Widget.ManualMember removed"].
      I selected only G for investigation. Explain the routing for the report
      and the next prerequisite for G. Do not run MCP tools, invoke external
      skills, or edit files.
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config: &readOnly
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: output-matches
        config:
          pattern: "(?s)(?=.*GeneratorMember)(?=.*CustomMember)(?=.*ManualMember)(?=.*generator)(?=.*client customization)(?=.*manual)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Route each item using its mitigation field while preserving all
            category/resolution/origin associations. Only G is selected: verify
            availability and proven support in the target SDK mitigation skill
            before execution. C and M remain visible but unselected/unchanged.
            The common emitter-change category must not collapse their routes
            into generator fixes or imply any authorization to edit.

  - name: client-route-does-not-grant-spec-scope
    rubric:
      - Honor client customization as the entry point while preserving the separate SDK-only edit authorization.
      - A resolution requiring client.tsp must be handed to the spec owner, not used to widen scope or advance the pinned commit.
    environment: *onlySkill
    prompt: |
      Plan the next step only for .NET Azure.Contoso.Widget at C:\sdk\contoso.
      Its complete classified break has mitigation="client customization",
      category="spec change", resolution="A client.tsp change is required",
      and originBreaks=["CP0002: Widget.Name removed"].
      I selected the item but authorize only SDK CustomCode. Spec inputs and
      the tsp-location.yaml pinned commit must remain unchanged. There is no
      supported SDK-only repair. Does the mitigation field authorize SpecInputs
      or All? Do not call MCP tools or edit files.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:CustomCode|SDK.only))(?=.*(?:handoff|hand.off|spec owner|SpecChangeRequired))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The field chooses the customization entry point, not edit scope.
            Because the repair requires unauthorized spec inputs, give a
            concrete spec-owner handoff while preserving the pin and raw
            evidence. No All/SpecInputs fallback, no invented CustomCode repair,
            and no claim that a tool already returned a result in this dry run.

  - name: manual-route-overrides-category-inference
    rubric:
      - Keep the selected item manual despite its emitter-change category or suggested resolution text.
      - Preserve origin evidence and require owner judgment, not automated generator or customization execution.
    environment: *onlySkill
    prompt: |
      Review this captured .NET breaking change for Azure.ResourceManager.Contoso
      at C:\sdk\contoso. The break has mitigation="manual",
      category="emitter change", resolution="Investigate whether a naming
      customization is possible; no supported pattern is proven",
      and originBreaks=["CP0002: Widget.OldName removed", "Widget.NewName added"].
      I selected this item for review. Can the category or resolution promote it
      to an automatic generator fix? Discuss only; no MCP calls or file edits.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*manual)(?=.*(?:evidence|confidence|unproven|judgment|decision))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Honor manual and preserve both original API changes. Neither the
            emitter-change category nor speculative resolution overrides the
            route. User selection authorizes review, not automatic mitigation;
            the removal/addition pair is still not proven rename evidence.

  - name: missing-dotnet-route-stops-classification
    rubric:
      - Report missing mitigation on a .NET break as a classification contract error while preserving raw evidence.
      - Do not infer generator from category or invent a route to continue.
    environment: *onlySkill
    prompt: |
      Interpret a captured .NET SDK report only; no MCP calls or edits.
      Package Azure.Contoso.Widget at C:\sdk\contoso, baseline/current inputs
      verified. Its breakingChanges entry is:
      {"breakingChange":"Widget.Name removed","category":"emitter change",
       "resolution":"Follow SDK guidance","originBreaks":["CP0002: Widget.Name removed"]}
      The mitigation field is absent. The outer response says success.
      Can mitigation proceed by assuming generator from the category?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:missing|absent|required))(?=.*(?:mitigation|route))(?=.*CP0002)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Explain that the common property is optional for legacy languages
            but required for a classified .NET break. Preserve the raw removal
            diagnostic, stop for a corrected classification, and do not infer
            an automatic route or a clean result from outer success.

  - name: null-dotnet-route-is-not-manual-default
    rubric:
      - A null .NET mitigation is an incomplete classification, not an implicit manual or generator route.
      - Retain the break and request a corrected classified result before mitigation.
    environment: *onlySkill
    prompt: |
      Review a captured .NET management compatibility result without MCP calls.
      Azure.ResourceManager.Contoso at C:\sdk\contoso has a classified removal
      with category="unknown", resolution=null, mitigation=null, and
      originBreaks=["CP0002: Widget.Get removed"].
      I selected the item. May the workflow treat null as manual and continue
      as though classification succeeded?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*null)(?=.*(?:incomplete|error|invalid|blocked|missing))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Stop on null route rather than silently synthesizing manual or
            generator as a valid classifier result. A manual handoff to resolve
            missing classification is appropriate, but the report must remain
            explicitly incomplete with CP0002 preserved.

  - name: invalid-dotnet-route-is-not-coerced
    rubric:
      - Reject the unsupported mitigation value and preserve the error/evidence.
      - Do not normalize the value into an allowed route, suppress diagnostics or execute a fix.
    environment: *onlySkill
    prompt: |
      Review this captured .NET SDK breaking-change result only; no MCP calls.
      Azure.Contoso.Widget at C:\sdk\contoso has mitigation="suppress",
      category="emitter change", resolution="Make the check green",
      originBreaks=["CP0002: Widget.Name removed"].
      What can the shared workflow do with this route?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*suppress)(?=.*(?:invalid|unsupported|error|reject))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Only generator, client customization and manual are valid routes.
            Reject suppress, keep CP0002 and stop for a corrected classification.
            Do not coerce it into a valid route, apply suppression, or accept
            resolution text as permission to bypass compatibility.

  - name: java-legacy-route-omission-is-valid
    rubric:
      - Accept absent mitigation for the legacy Java contract while retaining category, resolution and origin evidence.
      - Use the verified selected customization within CustomCode; do not require .NET classification fields or the .NET mitigation skill.
    environment: *onlySkill
    prompt: |
      Plan only the selected SDK compatibility action for Java package
      azure-resourcemanager-contoso at C:\sdk\java\contoso. A complete classified
      legacy result omits mitigation. The break has category="conversion-need resolve",
      resolution="Apply the verified hand-written customization repair",
      originBreaks=["ContosoCustomization.getName removed"].
      Source review verified this SDK-only repair and unchanged wire semantics.
      I select it and authorize CustomCode only, preserving spec inputs/pin.
      Do not call MCP tools or edit files. Is missing mitigation a blocker here?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*azsdk_customized_code_update)(?=.*CustomCode)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Absence is valid under the Java legacy contract, so do not reject it
            using .NET-only requirements or invent a required enum. Preserve
            metadata/evidence and plan the verified selected repair through the
            current customization tool with CustomCode. No .NET SDK skill or
            wider scope, and compatibility still needs a post-change rerun.

  - name: explicit-python-manual-route-is-honored
    rubric:
      - Honor a supplied manual mitigation even outside .NET; optional does not mean ignored.
      - Preserve the legacy metadata and scope, and do not convert manual into an automatic customization.
    environment: *onlySkill
    prompt: |
      Review the SDK compatibility route for Python azure-contoso at
      C:\sdk\python\contoso. The classified break includes mitigation="manual",
      category="spec change", resolution="Owner must review changed wire semantics",
      originBreaks=["Widget.name wire meaning changed"].
      I selected this item for review, not edits. The common mitigation field is
      optional for this language. Should it be ignored in favor of automatic
      naming customization? Explain only; no MCP calls or file edits.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*manual)(?=.*(?:owner|wire|semantic))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Optional means legacy omission is permitted, not that a supplied
            route may be discarded. Honor manual, retain category/resolution/
            originBreaks, and require owner judgment for the wire semantics.
            No automatic naming fix or .NET-specific skill is appropriate.
