name: azsdk-common-sdk-breaking-change-mitigation
description: Dry-run mitigation selection, verified .NET guidance, edit scopes, and bounded re-evaluation
type: capability
environment: azsdk-mcp-mock
tags:
  area: azsdk-common-sdk-breaking-change
  type: ci-gate
defaults:
  runs: 1
  timeout: "120s"
  model: gpt-5.4
  executor: copilot-sdk
scoring:
  threshold: 1.0
  weights:
    skill-invocation: 0.25
    tool-calls: 0.25
    output-matches: 0.2
    prompt: 0.3
stimuli:
  - name: selected-management-generator-pattern
    rubric:
      - Route the selected candidate through the target SDK mitigate-breaking-changes skill only after verifying availability and proven pattern support.
      - Do not fabricate invocation syntax, use blanket AI customization, or claim an unapplied fix succeeded.
    environment: &onlySkill
      skills:
        - ..
    prompt: |
      Use the SDK breaking-change workflow for a dry-run routing decision only.
      Do not call MCP tools, invoke external skills, or edit files.
      Package: .NET management Azure.ResourceManager.Contoso at
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.ResourceManager.Contoso.
      A complete latest-GA comparison identifies one break with
      mitigation="generator" and category="emitter change". I
      selected its deterministic generator mitigation. The detector cites a
      supported pattern in this SDK's mitigate-breaking-changes guidance.
      Explain the route and what you must verify before executing it. Do not
      invent the pattern implementation or invocation syntax.
    constraints: &bounded
      max_turns: 8
      max_tokens: 10000
      max_duration: "120s"
    graders:
      - type: skill-invocation
        config: &requiresSkill
          required: [azsdk-common-sdk-breaking-change]
      - type: tool-calls
        config: &readOnly
          disallowed:
            - name: "^azure-sdk-mcp-azsdk_"
      - type: output-matches
        config:
          pattern: "mitigate-breaking-changes"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Route to the target .NET SDK's existing mitigate-breaking-changes
            skill, first verifying availability, its current instructions, and
            proof that this particular change matches a supported pattern.
            Do not blanket-route generator mitigations through generic AI
            customization, invent parameters/decorators, or claim it was applied.

  - name: data-plane-pattern-needs-verified-support
    rubric:
      - Keep common .NET detection but do not invoke the installed management-only mitigation skill for data plane.
      - Require separate verified data-plane guidance or a manual handoff; a generator route does not authorize ARM-specific fixes.
    environment: *onlySkill
    prompt: |
      Dry-run the SDK breaking-change route only, with no MCP calls or edits.
      Package: .NET data plane Azure.Contoso.Widget at
      C:\sdk\azure-sdk-for-net\sdk\contoso\Azure.Contoso.Widget.
      The classified report sets mitigation="generator" for a signature change
      as a possible supported pattern. I selected this item for investigation.
      The installed mitigate-breaking-changes skill explicitly targets
      management-plane SDKs. No verified data-plane pattern guidance is available.
      Should the common workflow apply that installed skill to this package?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:data.plane|dataplane))(?=.*(?:management|ARM))(?=.*(?:manual|handoff|guidance|support))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            The common detection flow still applies to data plane, but the
            installed management-only mitigation skill does not. Require
            separately verified data-plane guidance and otherwise hand off.
            Do not invoke the management skill, borrow ARM patterns, or treat
            mitigation=generator as proof that such fixes apply.

  - name: external-mitigation-skill-unavailable
    rubric:
      - Report the missing external SDK skill/guidance, preserve CP0002 and hand off the unverified pattern.
      - Require verified guidance/manual ownership rather than claiming universal availability or inventing tools and fixes.
    environment: *onlySkill
    prompt: |
      Use the SDK breaking-change workflow to explain a handoff only.
      The local .NET repository C:\sdk\azure-sdk-for-net has no
      .github\skills\mitigate-breaking-changes\SKILL.md, and no verified pattern
      guidance is available. Azure.ResourceManager.Contoso has CP0002 removals.
      The classifier sets mitigation="generator", but pattern support is unverified.
      Do not call MCP tools, invent a skill, fetch remote content, or edit files.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(manual|handoff|guidance|unavailable)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Explicitly report the missing SDK skill/guidance and retain the
            removal diagnostics and candidate status. Request verified SDK
            guidance or manual ownership rather than asserting universal skill
            availability, fabricating its arguments, or substituting unsafe fixes.

  - name: selected-client-tsp-spec-inputs
    rubric:
      - Plan azsdk_customized_code_update with the supplied packagePath, selected customizationRequest, authorized tspProjectPath and editScope=SpecInputs.
      - Treat the old name as historical only; no invented decorators, broadened scope or unverified compatibility-success claim.
    environment: *onlySkill
    prompt: |
      Plan only the next SDK breaking-change customization call; no MCP calls or
      file edits. For .NET Azure.Contoso.Widget at C:\sdk\net\sdk\contoso,
      the report and source review prove this is only an SDK naming regression,
      with unchanged wire contract and semantics. The break has
      mitigation="client customization". I select preserving that name
      in client.tsp, and authorize only spec inputs at
      C:\specs\specification\contoso\Contoso.Widget.
      An old issue calls the tool azsdk_typespec_customized_code_update.
      Show the current tool and correct scope/inputs, without guessing decorators.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*azsdk_customized_code_update)(?=.*SpecInputs)(?=.*customizationRequest)(?=.*tspProjectPath)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Plan the current azsdk_customized_code_update using packagePath,
            selected-evidence customizationRequest, authorized tspProjectPath,
            and editScope=SpecInputs. Explain that the historical name is not
            callable. Do not broaden to All/CustomCode, invent a decorator, or
            claim compatibility was restored without regeneration/re-detection.

  - name: selected-sdk-custom-code-preserves-pin
    rubric:
      - Plan the selected repair using azsdk_customized_code_update with editScope=CustomCode.
      - Preserve all spec inputs, caches and pinned revision; no generated-source edits or pin advances, and rerun detection after refresh.
    environment: *onlySkill
    prompt: |
      Plan only a user-selected SDK breaking-change mitigation; no MCP calls or
      edits. Package .NET Azure.Contoso.Widget at C:\sdk\net\sdk\contoso.
      Source review proves the compatibility break is in hand-written SDK
      customization and identifies a supported repair; its
      mitigation="client customization". I authorize SDK custom
      code only. tsp-location.yaml pins commit
      0123456789abcdef0123456789abcdef01234567.
      What tool/scope should be used, and what must remain unchanged?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*azsdk_customized_code_update)(?=.*CustomCode)(?=.*(?:pin|commit|revision))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Use editScope=CustomCode for only selected hand-written SDK changes.
            Preserve client.tsp, tspconfig.yaml, tsp-location.yaml, cached spec
            inputs, and the pinned revision. Never plan direct generated-source
            edits or a pin advance, and require re-detection after artifact refresh.

  - name: spec-change-required-is-handoff
    rubric:
      - Stop on SpecChangeRequired and hand the evidence and necessary client.tsp work to the spec owner.
      - Do not automatically retry with All/SpecInputs, modify caches, advance the pin or claim the unresolved break is fixed.
    environment: *onlySkill
    prompt: |
      Review the next step in the SDK breaking-change workflow only; no MCP calls.
      Azure.ResourceManager.Contoso at C:\sdk\net\sdk\contoso has a pinned spec
      commit and SDK-only authorization. The break's mitigation="client customization".
      The selected CustomCode request
      returned SpecChangeRequired: the needed client.tsp change belongs in
      C:\specs\specification\contoso\Contoso.Management.
      Should the agent retry the same request with All to finish automatically?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*SpecChangeRequired)(?=.*(?:handoff|hand.off|spec owner|specification owner))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Stop and hand off the selected change, diagnostics and required
            client.tsp work to the spec owner. Do not retry with All or SpecInputs
            without new explicit authorization, modify spec caches, advance the
            pinned commit, or claim the unresolved break is fixed.

  - name: ambiguous-removal-addition-not-proven-rename
    rubric:
      - Retain both changes and low confidence; removal/addition pairing alone does not prove rename.
      - Require source/operation/wire evidence and manual judgment instead of proposing an unproven automatic compatibility fix.
    environment: *onlySkill
    prompt: |
      Analyze this SDK breaking-change routing choice only, without MCP calls.
      .NET Azure.ResourceManager.Contoso at C:\sdk\contoso: CP0002 removes
      WidgetResource.Get; another change adds WidgetResource.Fetch. There is no
      verified source mapping, operation identity, or wire-contract comparison.
      The classifier notes a low-confidence rename hypothesis and sets
      mitigation="manual". I selected the pair
      for review. Is a naming decorator or deterministic rename mitigation safe?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(rename.{0,160}(unproven|hypothesis|uncertain|not|evidence)|(?:not|insufficient|ambiguous).{0,160}rename)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Preserve both changes and low confidence. Paired removal/addition
            does not prove rename, so require source/operation/wire evidence and
            manual/user judgment. Selection alone cannot justify a decorator,
            compatibility shim, suppression, or generator fix.

  - name: wire-contract-change-needs-owner-judgment
    rubric:
      - Explain that preserving an SDK name cannot restore changed wire serialization or semantics.
      - Require service/spec owner judgment rather than an automatic naming, generated-source or serialization fix.
    environment: *onlySkill
    prompt: |
      Plan SDK breaking-change handling only; do not call MCP tools or edit.
      .NET data-plane Azure.Contoso.Widget at C:\sdk\contoso now serializes a
      different wire field and changes its meaning. The SDK member was also
      renamed, and mitigation="manual". I want backward compatibility, and
      selected this break for review.
      Can preserving the old client.tsp SDK name alone make it compatible?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(wire|serializ|semantic).{0,160}(contract|change|review|decision|compatib)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Explain that SDK naming alone does not restore the wire/semantic
            contract. Require a service/spec owner and manual contract decision,
            not automatic clientName, generated code changes, or a fabricated
            serialization compatibility fix.

  - name: reject-generated-source-and-suppression-shortcuts
    rubric:
      - Reject direct generated SDK edits and disabling or suppressing compatibility/analyzer diagnostics as mitigation.
      - Require verified supported source/generator changes and user selection, with no unsafe bypass instructions.
    environment: *onlySkill
    prompt: |
      Discuss this proposed SDK breaking-change fix only; do not run MCP tools
      or change files. Azure.Contoso.Widget at C:\sdk\contoso has CP0002 after
      generation, classified with mitigation="manual". To make CI green, could
      we hand-edit src\Generated\Widget.cs
      and disable ApiCompat/analyzer diagnostics? Regeneration will happen later.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?is)(?=.*(?:generated|suppress|disable))(?=.*(?:do not|never|unsafe|avoid|reject|must not|no[,:]))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Reject both direct generated SDK editing and disabling/suppressing
            compatibility or analyzer checks as mitigation. Route through
            verified source/generator customization and user-selected actions,
            and do not provide an unsafe bypass command or claim clean CI fixes
            the underlying API contract.

  - name: two-round-limit-retains-unresolved-breaks
    rubric:
      - Stop after two approved unsuccessful rounds and preserve unresolved CP0002 and evidence from both rounds.
      - Build success does not prove compatibility; no third automatic pass, wider scope or suppression.
    environment: *onlySkill
    prompt: |
      Review this SDK breaking-change loop state only; no MCP calls or edits.
      Azure.ResourceManager.Contoso at C:\sdk\contoso completed two approved
      mitigation rounds. Current artifacts were regenerated and detected after
      each; CP0002 for WidgetResource.Get remains unchanged with
      mitigation="client customization". Ordinary build
      now succeeds. Should the agent make a third automatic customization pass?
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*CP0002)(?=.*(?:stop|Stop|manual|handoff|unresolved))"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Stop rather than automatically starting a third round. Retain the
            unresolved CP0002, both rounds' evidence, and independent build
            success. Request manual judgment/new resolved prerequisites; do not
            expand scope, suppress the break, or confuse build success with
            compatibility.

  - name: tool-error-does-not-trigger-wider-retry
    rubric:
      - Stop immediately on the timeout and retain partial-edit state without claiming success.
      - No automatic retry or widened scope; resolve prerequisites and obtain selection before refreshing artifacts and detecting again.
    environment: *onlySkill
    prompt: |
      Review the SDK breaking-change mitigation state only; no MCP calls.
      A user-selected CustomCode request for Azure.Contoso.Widget at
      C:\sdk\contoso, classified as mitigation="client customization",
      timed out after reporting partial edits. The pinned spec
      commit must remain unchanged, and no current compatibility rerun exists.
      Explain the safe next step and whether an automatic All retry is allowed.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?i)(partial|timeout|timed out).{0,160}(edit|error|state|evidence|chang)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Stop immediately, preserve error/partial-edit state, and do not
            claim success or automatically retry/widen scope. Require inspection
            and resolved prerequisites with renewed user selection before
            refreshing current artifacts and rerunning compatibility.

  - name: re-evaluate-before-ordinary-gates
    rubric:
      - Refresh artifacts as needed, rerun classified detection, then run ordinary build/check/tests and keep the results independent.
      - Current .NET artifacts remain comparable despite separate gate errors; stale/missing artifacts block a verdict and changed later artifacts require re-detection.
    environment: *onlySkill
    prompt: |
      Plan the remaining shared SDK breaking-change steps only; no MCP calls.
      .NET Azure.Contoso.Widget at C:\sdk\contoso has one selected, verified
      mitigation="generator" applied to generator inputs, but current comparison
      artifacts
      have not been refreshed. We still need compatibility, compilation/analyzer,
      package-check and test results. Explain the order and failure handling.
    constraints: *bounded
    graders:
      - type: skill-invocation
        config: *requiresSkill
      - type: tool-calls
        config: *readOnly
      - type: output-matches
        config:
          pattern: "(?s)(?=.*azsdk_package_detect_breaking_change)(?=.*azsdk_package_run_check)(?=.*azsdk_package_run_tests)"
      - type: prompt
        config:
          model: gpt-5.4
          scoring: binary
          threshold: 1.0
          prompt: |
            Refresh/regenerate and rebuild only as needed to obtain current
            artifacts, rerun the detector with classification, then perform the
            ordinary build/check/tests. Keep all outcomes separate: current
            .NET artifacts can be compared despite independent analyzer/build
            gate errors, but missing/stale artifacts block a current verdict.
            If later builds change the compared artifacts, repeat detection.
            Do not report mitigation success from build alone or bypass checks.
